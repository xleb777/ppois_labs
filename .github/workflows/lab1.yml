name: Lab 1 C++

on:
  pull_request:
    branches: [main]
    paths: ['lab1/**', '.github/workflows/lab1.yml']
  push:
    branches: [main]
    paths: ['lab1/**', '.github/workflows/lab1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab1
    steps:
      - uses: actions/checkout@v4
      - name: Install build and QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config catch2 gcovr cppcheck doxygen
      - name: Static analysis
        run: make lint
      - name: Run Catch2 and require more than 90% line coverage
        run: make coverage
      - name: Generate API documentation
        run: make docs
      - name: Build and smoke-test a standalone Linux binary
        run: |
          make release
          printf '1\n3\n0\n0\n' | build/release/lab1 | grep 'длина: 0'
      - name: Package the executable, documentation and coverage report
        run: |
          tar -czf lab1-linux-x86_64.tar.gz -C build/release lab1
          tar -czf lab1-doxygen-html.tar.gz -C build/docs/html .
          tar -czf lab1-coverage-html.tar.gz -C build/coverage/report .
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-linux-and-reports
          path: lab1/*.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-catch
      - name: Run tests and build a standalone Windows executable
        shell: msys2 {0}
        run: |
          set -e
          make -C lab1 EXEEXT=.exe test
          make -C lab1 EXEEXT=.exe release
      - name: Run the executable in PowerShell and package it
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $output = @('1', '3', '0', '0') | & .\lab1\build\release\lab1.exe
          if ($LASTEXITCODE -ne 0 -or -not ($output -match 'длина: 0')) {
            throw "The Windows executable did not produce the expected menu output."
          }
          Compress-Archive -LiteralPath lab1/build/release/lab1.exe -DestinationPath lab1/lab1-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-windows
          path: lab1/lab1-windows-x86_64.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lab1-*
          merge-multiple: true
          path: distribution
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="lab1-build-${RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" distribution/*.tar.gz distribution/*.zip --clobber
          else
            gh release create "$tag" distribution/*.tar.gz distribution/*.zip --target "$COMMIT_SHA" \
              --title "Lab 1 C++ (build ${RUN_NUMBER})" --generate-notes
          fi
