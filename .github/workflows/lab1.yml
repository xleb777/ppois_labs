name: Lab 1 C++

on:
  pull_request:
    branches: [main]
    paths: ['lab1/**', '.github/workflows/lab1.yml']
  push:
    branches: [main]
    paths: ['lab1/**', '.github/workflows/lab1.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab1
    steps:
      - uses: actions/checkout@v4
      - name: Install build and QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config catch2 gcovr cppcheck doxygen
      - name: Static analysis
        run: make lint
      - name: Run Catch2 and require more than 90% line coverage
        run: make coverage
      - name: Generate API documentation
        run: make docs
      - name: Build and smoke-test a standalone Linux binary
        run: |
          make release
          printf '1\n3\n0\n0\n' | build/release/lab1 | grep 'длина: 0'
      - name: Package the executable, documentation and coverage report
        run: |
          tar -czf lab1-linux-x86_64.tar.gz -C build/release lab1
          tar -czf lab1-doxygen-html.tar.gz -C build/docs/html .
          tar -czf lab1-coverage-html.tar.gz -C build/coverage/report .
      - uses: actions/upload-artifact@v4
        with:
          name: lab1-distribution
          path: lab1/*.tar.gz
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab1-distribution
          path: distribution
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="lab1-build-${RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" distribution/*.tar.gz --clobber
          else
            gh release create "$tag" distribution/*.tar.gz --target "$COMMIT_SHA" \
              --title "Lab 1 C++ (build ${RUN_NUMBER})" --generate-notes
          fi
